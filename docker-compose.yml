services:
  front:
    build:
      context: ./front
    environment:
      - VITE_BASE_URL=http://localhost:8091
    ports:
      - "8090:80"
  back:
    build:
      context: ./back
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=mysql
      - DB_PASSWORD=mysql
    ports:
      - "8091:3000"
  db:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=mysql
      - MYSQL_DATABASE=mysql
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
  adminer:
    image: adminer
    ports:
      - "8080:8080"

volumes:
  db-data: 